name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap, as a candidate runs it
        run: npm run bootstrap
      - name: Resolve pnpm
        run: echo "PNPM=npx pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_ENV"
      - name: Lint and format
        run: $PNPM check
      - name: Unit tests
        run: $PNPM test
      - name: API e2e tests
        run: $PNPM test:e2e
      - name: Repro runs
        run: $PNPM repro
